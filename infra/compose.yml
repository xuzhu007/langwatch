# fork 定制：app / workers 的镜像可覆盖。
#
# 这两个服务跑的是本仓库的代码，而本仓库是 fork，带着官方镜像里
# 没有的定制（例如老内核不支持 renameat2 时的 ClickHouse 迁移写法）。
# 写死 `langwatch/langwatch:latest` + `pull_policy: always` 会让自建镜像
# 永远用不上：即使把本地镜像打成同名 tag，每次 `up` 也会从远端重拉
# 覆盖，表现为“重新打包了但报错照旧”。
#
# 用自建镜像：
#   docker build -f infra/docker/Dockerfile -t langwatch-local:dev .
#   LANGWATCH_IMAGE=langwatch-local:dev LANGWATCH_PULL_POLICY=never docker compose -f infra/compose.yml up -d
#
# 不设这两个变量时行为与以前完全一致（官方 latest + 每次拉取）。
services:
  app:
    image: ${LANGWATCH_IMAGE:-langwatch/langwatch:latest}
    environment:
      SKIP_ENV_VALIDATION: true
      DATABASE_URL: postgresql://prisma:prisma@postgres:5432/mydb?schema=mydb
      CLICKHOUSE_URL: http://default:langwatch@clickhouse:8123/langwatch
      # This compose stack runs a plain ClickHouse with no backups, so
      # system.backup_log does not exist here. Backup-status collection is on by
      # default (an unset flag must not disarm the alerts that read those gauges
      # in deployments that do have backups), so opt out explicitly rather than
      # failing the query on every stats tick.
      CLICKHOUSE_BACKUP_METRICS_ENABLED: "false"
      REDIS_URL: redis://redis:6379
      LANGWATCH_NLP_SERVICE: http://langwatch_nlp:5561
      LANGEVALS_ENDPOINT: http://langevals:5562
      LANGWATCH_ENDPOINT: http://app:5560
      INSTALL_METHOD: docker
      NODE_ENV: production
    env_file:
      - platform/app/.env
    pull_policy: ${LANGWATCH_PULL_POLICY:-always}
    ports:
      - "5560:5560"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  workers:
    image: ${LANGWATCH_IMAGE:-langwatch/langwatch:latest}
    command: ["pnpm", "run", "start:workers"]
    working_dir: /app/platform/app
    environment:
      SKIP_ENV_VALIDATION: true
      DATABASE_URL: postgresql://prisma:prisma@postgres:5432/mydb?schema=mydb
      CLICKHOUSE_URL: http://default:langwatch@clickhouse:8123/langwatch
      # This compose stack runs a plain ClickHouse with no backups, so
      # system.backup_log does not exist here. Backup-status collection is on by
      # default (an unset flag must not disarm the alerts that read those gauges
      # in deployments that do have backups), so opt out explicitly rather than
      # failing the query on every stats tick.
      CLICKHOUSE_BACKUP_METRICS_ENABLED: "false"
      REDIS_URL: redis://redis:6379
      LANGWATCH_NLP_SERVICE: http://langwatch_nlp:5561
      LANGEVALS_ENDPOINT: http://langevals:5562
      LANGWATCH_ENDPOINT: http://app:5560
      NODE_ENV: production
    env_file:
      - platform/app/.env
    pull_policy: ${LANGWATCH_PULL_POLICY:-always}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    restart: always

  # nlpgo — the Go NLP engine. langwatch/langwatch_nlp is now a static Go
  # binary (Dockerfile.langwatch_nlp); it still binds :5561 and reads
  # LANGWATCH_ENDPOINT for evaluator + agent-workflow callbacks.
  langwatch_nlp:
    image: langwatch/langwatch_nlp:latest
    env_file:
      - platform/app/.env
    ports:
      - "5561:5561"
    restart: always
    pull_policy: always
    environment:
      - LANGWATCH_ENDPOINT=http://app:5560

  langevals:
    image: langwatch/langevals:latest
    ports:
      - "5562:5562"
    restart: always
    pull_policy: always
    environment:
      - DISABLE_EVALUATORS_PRELOAD=true

  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: mydb
      POSTGRES_USER: prisma
      POSTGRES_PASSWORD: prisma
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prisma -d mydb"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  clickhouse:
    image: langwatch/clickhouse-serverless:0.2.0
    environment:
      CLICKHOUSE_PASSWORD: langwatch
    ports:
      - "8123:8123"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "1.0"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: always

volumes:
  db-data:
  redis-data:
  clickhouse-data:
