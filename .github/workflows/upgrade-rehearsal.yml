name: Upgrade rehearsal

# Runner: dev/scripts/upgrade-rehearsal/rehearse.sh (see its README).
on:
  workflow_dispatch:
  push:
    branches: ["upgrade/upstream-3.25.0"]

permissions:
  contents: read

concurrency:
  group: upgrade-rehearsal-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  service-images:
    uses: ./.github/workflows/fork-service-images.yml

  rehearse:
    name: Rehearse the release image
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OLD_FORK_COMMIT: d71a11654b7316f68fadae742472808bc15dc972
      OLD_FORK_IMAGE: langwatch-fork:3.23.0-d71a11654
      HEAD_IMAGE: langwatch-fork:3.25.0
      REHEARSAL_IS_SAAS: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24.22.1"

      - name: Build the release image
        id: candidate
        run: |
          docker build -f infra/docker/Dockerfile \
            --build-arg LANGWATCH_BUILD_COMMIT="${GITHUB_SHA}" \
            -t "$HEAD_IMAGE" .
          echo "image_id=$(docker image inspect --format '{{.Id}}' "$HEAD_IMAGE")" >> "$GITHUB_OUTPUT"

      - name: Build the previous fork image
        run: |
          git archive --format=tar "$OLD_FORK_COMMIT" |
            docker build -f infra/docker/Dockerfile \
              --build-arg LANGWATCH_BUILD_COMMIT="$OLD_FORK_COMMIT" \
              -t "$OLD_FORK_IMAGE" -

      - name: Rehearse upgrade, rollback and re-upgrade from the previous fork
        id: fork
        run: |
          run_dir="${RUNNER_TEMP}/upgrade-rehearsal/main"
          bash dev/scripts/upgrade-rehearsal/rehearse.sh --origin main \
            --old-image "$OLD_FORK_IMAGE" --head-image "$HEAD_IMAGE" \
            --check-evaluation-rollback --run-dir "$run_dir"
          node dev/scripts/upgrade-rehearsal/assert-report.mjs "$run_dir"

      - name: Rehearse an empty install
        id: empty
        if: ${{ !cancelled() && steps.candidate.outcome == 'success' }}
        run: |
          run_dir="${RUNNER_TEMP}/upgrade-rehearsal/empty"
          bash dev/scripts/upgrade-rehearsal/rehearse.sh --origin empty \
            --head-image "$HEAD_IMAGE" --run-dir "$run_dir"
          node dev/scripts/upgrade-rehearsal/assert-report.mjs "$run_dir"

      - name: Upload fork rehearsal evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upgrade-rehearsal-main
          path: |
            ${{ runner.temp }}/upgrade-rehearsal/main/report.*
            ${{ runner.temp }}/upgrade-rehearsal/main/evidence/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload empty-install rehearsal evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upgrade-rehearsal-empty
          path: |
            ${{ runner.temp }}/upgrade-rehearsal/empty/report.*
            ${{ runner.temp }}/upgrade-rehearsal/empty/evidence/**
          if-no-files-found: warn
          retention-days: 14

      - name: Package the verified release image
        if: steps.fork.outcome == 'success' && steps.empty.outcome == 'success'
        env:
          TESTED_IMAGE_ID: ${{ steps.candidate.outputs.image_id }}
        run: |
          test "$(docker image inspect --format '{{.Id}}' "$HEAD_IMAGE")" = "$TESTED_IMAGE_ID"
          mkdir -p image-artifact
          docker save "$HEAD_IMAGE" | gzip > image-artifact/langwatch-3.25.0.tar.gz
          cd image-artifact
          sha256sum langwatch-3.25.0.tar.gz > SHA256SUMS
          printf '%s\n' "${GITHUB_SHA}" > SOURCE_COMMIT

      - name: Upload the release image
        if: steps.fork.outcome == 'success' && steps.empty.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: langwatch-self-hosted-3.25.0
          path: image-artifact/
          compression-level: 0
          retention-days: 7

  offline-compose:
    name: Run the packaged images in offline Compose
    needs: [rehearse, service-images]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24.22.1"

      - name: Download images from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "*-self-hosted-3.25.0"
          path: ${{ runner.temp }}/fork-images

      - name: Verify and load the packaged images
        run: |
          for service in langwatch langwatch_nlp langevals; do
            (
              cd "${RUNNER_TEMP}/fork-images/${service}-self-hosted-3.25.0"
              archive="${service}-3.25.0.tar.gz"
              source_commit="$(cat SOURCE_COMMIT)"
              checksum="$(sha256sum "$archive")"
              test "$source_commit" = "$GITHUB_SHA"
              test "$checksum" = "$(cat SHA256SUMS)"
              printf 'Verified %s from %s\n' "$checksum" "$source_commit"
              docker load -i "$archive"
            )
          done
          docker image inspect --format '{{.Id}}' langwatch-fork:3.25.0 \
            langwatch-fork-langwatch_nlp:3.25.0 langwatch-fork-langevals:3.25.0

      - name: Load base dependencies before disconnecting the stack
        run: |
          docker pull postgres:16
          docker pull redis:alpine
          docker pull langwatch/clickhouse-serverless:0.4.0

      - name: Test the air-gapped Compose stack
        run: |
          bash dev/scripts/upgrade-rehearsal/compose-offline-smoke.sh \
            --run-dir "${RUNNER_TEMP}/offline-compose"

      - name: Upload offline Compose evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: offline-compose-3.25.0
          path: |
            ${{ runner.temp }}/offline-compose/
            !${{ runner.temp }}/offline-compose/services.env
            !${{ runner.temp }}/offline-compose/isolated.yml
          if-no-files-found: warn
          retention-days: 14
