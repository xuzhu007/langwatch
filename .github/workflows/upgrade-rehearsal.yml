name: Upgrade rehearsal

# Runner: dev/scripts/upgrade-rehearsal/rehearse.sh (see its README).
on:
  workflow_dispatch:
  push:
    branches: ["upgrade/upstream-3.23.0"]

permissions:
  contents: read

concurrency:
  group: upgrade-rehearsal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rehearse:
    name: Rehearse from ${{ matrix.origin }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        origin: ["main", "empty"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24.22.1"

      - name: Build the release image
        run: |
          docker build -f infra/docker/Dockerfile \
            --build-arg LANGWATCH_BUILD_COMMIT="${GITHUB_SHA}" \
            -t langwatch-fork:3.23.0 .

      - name: Rehearse the upgrade
        env:
          ORIGIN: ${{ matrix.origin }}
          REHEARSAL_IS_SAAS: "false"
        run: |
          args=(--origin "$ORIGIN" --head-image langwatch-fork:3.23.0)
          if [[ "$ORIGIN" == "main" ]]; then args+=(--build-main); fi
          run_dir="${RUNNER_TEMP}/upgrade-rehearsal/${ORIGIN}"
          bash dev/scripts/upgrade-rehearsal/rehearse.sh "${args[@]}" --run-dir "$run_dir"
          node dev/scripts/upgrade-rehearsal/assert-report.mjs "$run_dir"

      - name: Upload rehearsal evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upgrade-rehearsal-${{ matrix.origin }}
          path: |
            ${{ runner.temp }}/upgrade-rehearsal/**/report.*
            ${{ runner.temp }}/upgrade-rehearsal/**/evidence/**
            ${{ runner.temp }}/upgrade-rehearsal/**/build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Package the verified release image
        if: success() && matrix.origin == 'empty'
        run: |
          mkdir -p image-artifact
          docker save langwatch-fork:3.23.0 | gzip > image-artifact/langwatch-3.23.0.tar.gz
          cd image-artifact
          sha256sum langwatch-3.23.0.tar.gz > SHA256SUMS
          printf '%s\n' "${GITHUB_SHA}" > SOURCE_COMMIT

      - name: Upload the release image
        if: success() && matrix.origin == 'empty'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: langwatch-self-hosted-3.23.0
          path: image-artifact/
          compression-level: 0
          retention-days: 7
